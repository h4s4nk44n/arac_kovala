# nixpacks.toml — Scrapling + patchright (replaces SeleniumBase + Chrome)

[phases.setup]
cmds = [
  # Step 1: System dependencies for patchright/Playwright Chromium
  "sudo apt-get update && sudo apt-get install -y --no-install-recommends ca-certificates fonts-liberation libasound2t64 libatk1.0-0 libatk-bridge2.0-0 libatspi2.0-0 libcairo2 libcups2 libdbus-1-3 libdrm2 libexpat1 libfontconfig1 libgdk-pixbuf2.0-0 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 libgbm1 libxshmfence1 wget",

  # Step 2: Create Python environment and install packages
  "python -m venv --copies /opt/venv",
  "sleep 1",
  ". /opt/venv/bin/activate && pip install -r requirements.txt",

  # Step 3: Install patchright Chromium browser
  ". /opt/venv/bin/activate && scrapling install && python -m patchright install chromium"
]

# patchright runs headless natively — no xvfb needed
[start]
cmd = "gunicorn -w 1 -k gthread -b 0.0.0.0:$PORT --timeout 300 --access-logfile - --error-logfile - --log-level info app:app"
