# nixpacks.toml

# Phase 1: Install system packages
[phases.setup]
# Use the modern, recommended method for adding the Google Chrome repository
cmds = [
  "wget -q -O /tmp/google_signing_key.pub https://dl.google.com/linux/linux_signing_key.pub",
  "sudo gpg --no-default-keyring --keyring /etc/apt/keyrings/google-chrome.gpg --import /tmp/google_signing_key.pub",
  "echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main' | sudo tee /etc/apt/sources.list.d/google-chrome.list"
]
# Install Chrome, the virtual display, and corrected modern dependencies
aptPkgs = [
  "libasound2t64", # Corrected package name
  "libatk1.0-0",
  "libcairo2",
  "libcups2",
  "libdbus-1-3",
  "libexpat1",
  "libfontconfig1",
  "libgdk-pixbuf2.0-0",
  "libglib2.0-0",
  "libgtk-3-0",
  "libnspr4",
  "libnss3",
  "libpango-1.0-0",
  "libpangocairo-1.0-0",
  "libx11-6",
  "libx11-xcb1",
  "libxcb1",
  "libxcomposite1",
  "libxcursor1",
  "libxdamage1",
  "libxext6",
  "libxfixes3",
  "libxi6",
  "libxrandr2",
  "libxrender1",
  "libxss1",
  "libxtst6",
  "ca-certificates",
  "fonts-liberation",
  "lsb-release",
  "xdg-utils",
  "wget",
  "xvfb",
  "google-chrome-stable"
]

# Phase 2: Explicitly define the command to start the web server
[start]
cmd = "gunicorn app:app --chdir ./backend"

