# nixpacks.toml

# Use a project-local virtualenv to avoid /opt/venv races that can cause
# "Text file busy" errors on some builders.
[phases.setup]
cmds = [
  "apt-get update && apt-get install -y --no-install-recommends gnupg ca-certificates fonts-liberation libasound2t64 libatk1.0-0 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgdk-pixbuf2.0-0 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 lsb-release xdg-utils wget xvfb",
  "mkdir -p /etc/apt/keyrings",
  "wget -q -O /etc/apt/keyrings/google-chrome.gpg https://dl.google.com/linux/linux_signing_key.pub",
  "echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main' > /etc/apt/sources.list.d/google-chrome.list",
  "apt-get update && apt-get install -y google-chrome-stable",
  "python -m venv .venv",
  ". .venv/bin/activate && pip install --upgrade pip setuptools wheel",
  ". .venv/bin/activate && pip install --no-cache-dir -r requirements.txt"
]

# Fallback start command if Procfile is not present.
[start]
cmd = "bash -lc '. .venv/bin/activate && exec gunicorn -w 1 -k gthread -b 0.0.0.0:$PORT app:app'"

