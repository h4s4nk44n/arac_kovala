# nixpacks.toml

# Phase 1: Install all system and language dependencies in a single, sequential block
[phases.setup]
cmds = [
  # Step 1: Install all base system dependencies, now including xauth
  "sudo apt-get update && sudo apt-get install -y --no-install-recommends xauth gnupg ca-certificates fonts-liberation libasound2t64 libatk1.0-0 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgdk-pixbuf2.0-0 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 lsb-release xdg-utils wget xvfb",
  
  # Step 2: Add Google Chrome's signing key and repository
  "wget -q -O /tmp/google_signing_key.pub https://dl.google.com/linux/linux_signing_key.pub",
  "sudo gpg --no-default-keyring --keyring /etc/apt/keyrings/google-chrome.gpg --import /tmp/google_signing_key.pub",
  "echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main' | sudo tee /etc/apt/sources.list.d/google-chrome.list",

  # Step 3: Update package lists again, then install Chrome
  "sudo apt-get update",
  "sudo apt-get install -y google-chrome-stable",

  # Step 4: Create Python environment and install packages, with a pause to prevent race conditions
  "python -m venv --copies /opt/venv",
  "sleep 1",
  ". /opt/venv/bin/activate && pip install -r requirements.txt"
]

# Phase 2: Define the command to start the web server
[start]
cmd = "gunicorn app:app"

